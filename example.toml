[bot]
# Site used when --site is not given (family:code, e.g. wikipedia:th)
defaultSite = "wikipedia:th"
# Account used when --user is not given — must match a username below
defaultUser = "PatsaBot"
contact = "[[:w:th:User:PatsaBot]]"
timezone = "Asia/Bangkok"

# Wiki families this bot knows how to reach. {code} is replaced with the
# site's code (th, en, www, ...). dbname is optional — only needed for
# families the replica database queries actually target.
[sites.wikipedia]
url = "https://{code}.wikipedia.org/w/api.php"
dbname = "{code}wiki_p"

[sites.wikidata]
url = "https://www.wikidata.org/w/api.php"
dbname = "wikidatawiki_p"

# Credentials. `site` selects which account applies: an exact site
# ("wikipedia:th"), a whole family ("wikipedia:*"), or every site ("*").
# The most specific match for the active --site wins. Add one [[accounts]]
# block per bot account you operate.
[[accounts]]
site = "wikipedia:th"
username = "PatsaBot"
# https://www.mediawiki.org/wiki/OAuth/Owner-only_consumers
[accounts.oauth]
consumerToken = ""
consumerSecret = ""
accessToken = ""
accessSecret = ""

[toolforge]
# Your Wikimedia developer account username (used to SSH into Toolforge)
sshUser = ""
# SSH host — change only if Toolforge ever migrates
sshHost = "login.toolforge.org"
# Path to your SSH private key — leave commented to use ~/.ssh/id_rsa (or ssh-agent)
# sshIdentityFile = "~/.ssh/id_ed25519"
tooluser = "tools.patsabot"
# Important: create it with good long and high entropy password
# eg. openssl rand -base64 32
webKey = ""

[replica]
# Wikimedia replica database
# https://wikitech.wikimedia.org/wiki/Help:Toolforge/Database
username = ""
password = ""
# Fallback when the active site's family has no dbname template
dbname = "thwiki_p"
cluster = "analytics"
port = 3306

[scripts.archive]
# archive custom basepage keysalt
key_salt = ""

[logger]
# on production, I set logPath to "/data/project/patsabot/www/static/logs"
logPath = "./logs"
# on production should be less verbose eg. "info"
level = "debug"

[discord.logger]
# Optional webhook for log forwarding
webhook = ""

[web]
# false = status/log endpoints require auth too (default: true = public read)
publicViewable = true
# JWT secret - generate: openssl rand -hex 32
# If unset, random secret generated on startup (tokens invalid after restart)
jwtSecret = ""

# Users for the web UI (passwords plain text - chmod 600 this file)
[[web.users]]
username = "admin"
password = "changeme"
role = "admin" # "admin" = full control, "viewer" = read only

[[web.users]]
username = "viewer"
password = "viewpass"
role = "viewer"
